name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go fmt
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Run shellcheck
        run: shellcheck dev/*.sh hack/*.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o bin/authstep ./cmd/authstep

      - name: Run tests
        run: go test -race ./... -coverprofile=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Run govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && govulncheck ./...

  deadcode:
    name: Deadcode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          OUTPUT=$(deadcode -test ./...)
          if [ -n "$OUTPUT" ]; then
            echo "::error::deadcode found unreachable code:"
            echo "$OUTPUT"
            exit 1
          fi

  js:
    name: Browser JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      # The tests check pkix.js output with the openssl CLI.
      - name: Run tests
        run: node --test internal/web/jstest/*.test.mjs

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.2

      - name: Build chart dependencies
        run: |
          helm repo add smallstep https://smallstep.github.io/helm-charts
          helm dependency build charts/authstep

      - name: Lint Helm chart
        run: |
          for extra in \
            "--set ca.url=https://step-certificates.step.svc.cluster.local --set ca.root.configMap=root" \
            "--set step-certificates.enabled=true --set litestream.enabled=true --set litestream.url=s3://b/a --set litestream.existingSecret=l"; do
            # shellcheck disable=SC2086 # $extra holds several flags
            helm lint charts/authstep --strict -f charts/authstep/tests/values-required.yaml $extra
          done

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.2.1 --verify=false

      - name: Run Helm unit tests
        run: helm unittest charts/authstep

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
