{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authstep.fullname" . }}
  labels:
    {{- include "authstep.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "authstep.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # The UI is public; the ingress controller and users reach it.
    - ports:
        - port: http
    # SCEP webhooks are for step-ca only. AuthStep also requires step-ca's client certificate.
    - from:
        {{- if include "authstep.stepCAEnabled" . }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: step-certificates
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- else }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.stepCA.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.stepCA.podSelector | nindent 12 }}
        {{- end }}
      ports:
        - port: webhooks
{{- end }}
